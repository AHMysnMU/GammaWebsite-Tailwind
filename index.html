<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

    <title>Document</title>
  </head>

  <body class="bg-black text-blue-950">
    <header class="bg-white">
      <div class="max-w-7xl mx-auto">





        <!--Desktop navbar-->
        <nav class="hidden bp:flex gap-5 items-center pb-1 pt-2 px-10 mx-auto">


          <a href=""><img src="public/gamma.png" alt="Gamma Logo" class="h-6.5" /></a>


          <div class="me-auto">
            <ul class="flex items-center gap-1">
              <li><button class="btn">Products</button></li>
              <li><button class="btn">Solution</button></li>
              <li><a href="" class="btn inline-block">About</a></li>
              <li><a href="" class="btn inline-block">Pricing</a></li>
            </ul>
          </div>


          <ul class="flex gap-2 items-center">
            <li>
              <button class="btn flex justify-center items-center gap-1 px-4">
                <span class="mt-1"><ion-icon name="globe-outline"></ion-icon></span>English
              </button>
            </li>
            <li>
              <a href="" class="btn inline-block">Login</a>
            </li>
            <li>
              <a href="" class="btn inline-block px-8 ml-2 bg-blue-800 text-white hover:bg-blue-950">Start for free</a>
            </li>
          </ul>


        </nav>





        <!--Mobile Top navbar-->
        <nav class="flex bp:hidden items-center py-1 px-5 mx-auto">


          <div class="me-auto">
            <a href=""><img src="public/gamma.png" alt="Gamma Logo" class="h-7 inline" /></a>
          </div>


          <div class="flex justify-center items-center text-2xl">
            
            <button class="btn px-2 flex items-center justify-center">
              <span class=""><ion-icon name="globe-outline" class="block"></ion-icon></span>
            </button>
            
            <button id="open-menu" class="btn flex items-center justify-center px-2">
              <ion-icon name="menu-outline" class="block"></ion-icon>
            </button>
            
          </div>


        </nav>





        <!--Mobile all page navbar-->
        <nav id="mobile-menu" class="bp:hidden fixed inset-0 z-50 flex flex-col -translate-y-full transition-transform duration-500 ease-in-out bg-linear-to-b from-white/90 to-blue-300/90">
          
          
          <div class="flex items-center py-1 px-5 bg-white w-full">

            <a href="" class="me-auto">
              <img src="public/gamma.png" alt="Gamma Logo" class="h-7" />
            </a>

            <button id="close-menu" class="btn text-2xl px-2 mt-1 flex items-center justify-center">
              <ion-icon name="close-outline"></ion-icon>
            </button>

          </div>


          <div class="flex-1 w-full">

            <div class="flex flex-col text-2xl pt-10 mx-3">

              <div><a href="" class="navRows">Home</a></div>
              <hr />
              <div><button class="navRows text-left">Products</button></div>
              <hr />
              <div><button class="navRows text-left">Solutions</button></div>
              <hr />
              <div><a href="" class="navRows">About</a></div>
              <hr />
              <div><a href="" class="navRows">Pricing</a></div>

            </div>

          </div>


          <div class="flex flex-col gap-1 justify-center items-center py-5 mx-4">

            <button class="py-2 px-5 w-full text-center bg-blue-900 text-white rounded-full">Start for free</button>
          
            <button class="py-2 px-5 w-full text-center bg-white text-blue-900 rounded-full">Login</button>
            
          </div>


        </nav>





      </div>
    </header>






    <script>
      const openBtn = document.querySelector("#open-menu");
      const closeBtn = document.querySelector("#close-menu");
      const mobileMenu = document.querySelector("#mobile-menu");

      openBtn.addEventListener("click", () => {
        mobileMenu.classList.remove("-translate-y-full");
      });

      closeBtn.addEventListener("click", () => {
        mobileMenu.classList.add("-translate-y-full");
      });
    </script>





  </body>
</html>

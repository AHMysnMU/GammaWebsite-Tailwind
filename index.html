<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>

    <title>Document</title>
  </head>

  <body class="bg-black text-blue-950">
    <header class="bg-white">
      <div class="max-w-7xl mx-auto">
        <!--Desktop navbar-->
        <nav
          class="hidden bp:flex gap-5 justify-between items-center h-fit text-1xl pb-1 pt-2 px-10 mx-auto"
        >
          <div class="cursor-pointer">
            <a href=""
              ><img
                src="public/gamma.png"
                alt="Gamma Logo"
                class="h-6.5 inline"
            /></a>
          </div>

          <div class="me-auto">
            <ul class="flex items-center gap-1">
              <li><button class="btn">Products</button></li>
              <li><button class="btn">Solution</button></li>
              <li><a href="" class="btn inline-block">About</a></li>
              <li><a href="" class="btn inline-block">Pricing</a></li>
            </ul>
          </div>

          <ul class="flex gap-2 items-center">
            <li>
              <div>
                <button
                  href=""
                  class="btn flex justify-center items-center gap-1 px-4"
                >
                  <span class="mt-1"
                    ><ion-icon name="globe-outline"></ion-icon></span
                  >English
                </button>
              </div>
            </li>
            <li><a href="" class="btn inline-block">Login</a></li>
            <li>
              <a
                href=""
                class="btn inline-block px-8 ml-2 bg-blue-800 text-white hover:bg-blue-950"
                >Start for free</a
              >
            </li>
          </ul>
        </nav>

        <!--Mobile Top navbar-->
        <!--flex-->
        <nav class="flex bp:hidden items-center pb-1 pt-1 px-5 mx-auto wrap">
          <div class="cursor-pointer me-auto">
            <a href=""
              ><img src="public/gamma.png" alt="Gamma Logo" class="h-7 inline"
            /></a>
          </div>

          <div class="flex justify-center items-center text-2xl">
            <div class="">
              <button href="" class="btn cursor-pointer px-2 mt-1">
                <span class=""><ion-icon name="globe-outline"></ion-icon></span>
              </button>
            </div>

            <div>
              <button
                href=""
                id="open-menu"
                class="btn cursor-pointer mt-1 px-2"
              >
                <span class=""><ion-icon name="menu-outline"></ion-icon></span>
              </button>
            </div>
          </div>
        </nav>

        <!--Mobile all page navbar-->
        <!-- <nav
          id="mobile-menu"
          class="bp:hidden hidden fixed inset-0 h-screen flex flex-col bg-linear-to-b from-white/90 to-blue-300/90"
          
          > -->
        <nav
          id="mobile-menu"
          class="bp:hidden fixed inset-0 h-screen flex flex-col translate-x-full transition-transform duration-500 ease-in-out bg-linear-to-b from-white/90 to-blue-300/90"
        >
          <div class="flex items-center py-2 px-3 wrap bg-white w-full">

            <div class="cursor-pointer me-auto">
              <a href=""
                ><img
                  src="public/gamma.png"
                  alt="Gamma Logo"
                  class="h-7 inline"
              /></a>
            </div>

            <div class="text-2xl mx-3 ">
              <button
                id="close-menu"
                href=""
                class="btn cursor-pointer mt-1 pr-1"
              >
                <span class="flex"><ion-icon name="close-outline" class="ms-auto"></ion-icon></span>
              </button>
            </div>

          </div>


          <div class="flex-1 w-full">
            <div class="flex flex-col text-2xl pt-10 mx-3">
              <div><a href="" class="navRows">Home</a></div>
              <hr />
              <div><button class="navRows text-left">Products</button></div>
              <hr />
              <div><button class="navRows text-left">Solution</button></div>
              <hr />
              <div><a href="" class="navRows">About</a></div>
              <hr />
              <div><a href="" class="navRows">Pricing</a></div>
            </div>
          </div>

          <div
            class="flex flex-col gap-1 full-w justify-center items-center py-5 mx-4"
          >
            <div
              class="py-2 box-border px-5 w-full text-center bg-blue-900 text-white rounded-full"
            >
              <button class="">Start for free</button>
            </div>
            <div
              class="py-2 box-border px-5 w-full text-center bg-white text-blue-900 rounded-full"
            >
              <button class="">Login</button>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <script>
      const openBtn = document.querySelector("#open-menu");
      const closeBtn = document.querySelector("#close-menu");
      const mobileMenu = document.querySelector("#mobile-menu");

      openBtn.addEventListener("click", () => {
        mobileMenu.classList.remove("translate-x-full");
      });

      closeBtn.addEventListener("click", () => {
        mobileMenu.classList.add("translate-x-full");
      });
    </script>
  </body>
</html>
